for (const group of ED25519_TESTVECTORS.testGroups) {
  const key = KEYUTIL.getKey(group.publicKeyPem);
  for (const testCase of group.tests) {
    const description = `${testCase.tcId}: ${testCase.comment}`;
    test(`${description}`, () => {
      expect(1);
      const verifier = new KJUR.crypto.Signature({alg: 'EdDSAwithEd25519'});
      verifier.init(key);
      verifier.updateHex(testCase.msg);
      const result = verifier.verify(testCase.sig) ? "valid" : "invalid";
      ok(testCase.result === result, `tcId=${testCase.tcId} failed, not ${testCase.result}, ${JSON.stringify(testCase.flags)}`);
    });
  }
}
